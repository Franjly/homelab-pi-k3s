---
apiVersion: v1
kind: Service
metadata:
  name: pi-home-assistant-service
  namespace: external-endpoints
spec:
  ports:
  - name: http
    port: 8123
    protocol: TCP
    targetPort: 8123
  clusterIP: None
  type: ClusterIP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pi-home-assistant-service
  namespace: external-endpoints
  labels:
    kubernetes.io/service-name: pi-home-assistant-service
addressType: IPv4
ports:
- name: http
  port: 8123
  protocol: TCP
endpoints:
- addresses:
  - 192.168.60.250
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    hajimari.io/appName: Home Assistant
    hajimari.io/icon: home
    hajimari.io/group: Home Automation
    hajimari.io/targetBlank: 'false'
  name: pi-home-assistant-ingress
  namespace: external-endpoints
spec:
  ingressClassName: nginx
  rules:
  - host: home-assistant.local.tecno-fly.com
    http:
      paths:
      - backend:
          service:
            name: pi-home-assistant-service
            port:
              number: 8123
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - home-assistant.local.tecno-fly.com
    secretName: pi-hole-tls
