---
apiVersion: v1
kind: Service
metadata:
  name: unifi-external-service
  namespace: external-endpoints
spec:
  ports:
  - name: http
    port: 443
    protocol: TCP
    targetPort: 443
  clusterIP: None
  type: ClusterIP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: unifi-external-service
  namespace: external-endpoints
  labels:
    kubernetes.io/service-name: unifi-external-service
addressType: IPv4
ports:
- name: http
  port: 443
  protocol: TCP
endpoints:
- addresses:
  - 192.168.0.1
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    hajimari.io/appName: UniFi
    hajimari.io/icon: lan
    hajimari.io/group: Network
    hajimari.io/targetBlank: 'false'
  name: unifi-external-ingress
  namespace: external-endpoints
spec:
  ingressClassName: nginx
  rules:
  - host: unifi.local.tecno-fly.com
    http:
      paths:
      - backend:
          service:
            name: unifi-external-service
            port:
              number: 443
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - unifi.local.tecno-fly.com
    secretName: unifi-tls
