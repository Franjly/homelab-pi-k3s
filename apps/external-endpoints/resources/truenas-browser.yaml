---
apiVersion: v1
kind: Service
metadata:
  name: truenas-browser-external-service
  namespace: external-endpoints
spec:
  ports:
  - name: http
    port: 30044
    protocol: TCP
    targetPort: 30044
  clusterIP: None
  type: ClusterIP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas-browser-external-service
  namespace: external-endpoints
  labels:
    kubernetes.io/service-name: truenas-browser-external-service
addressType: IPv4
ports:
- name: http
  port: 30044
  protocol: TCP
endpoints:
- addresses:
  - 192.168.40.250
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    hajimari.io/appName: File Browser
    hajimari.io/icon: file-tree
    hajimari.io/group: NAS
    hajimari.io/targetBlank: 'false'
  name: truenas-browser-external-ingress
  namespace: external-endpoints
spec:
  ingressClassName: nginx
  rules:
  - host: truenas-browser.local.tecno-fly.com
    http:
      paths:
      - backend:
          service:
            name: truenas-browser-external-service
            port:
              number: 30044
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - truenas-browser.local.tecno-fly.com
    secretName: truenas-browser-tls
