---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-external-service
  namespace: external-endpoints
spec:
  ports:
  - name: http
    port: 10095
    protocol: TCP
    targetPort: 10095
  clusterIP: None
  type: ClusterIP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: qbittorrent-external-service
  namespace: external-endpoints
  labels:
    kubernetes.io/service-name: qbittorrent-external-service
addressType: IPv4
ports:
- name: http
  port: 10095
  protocol: TCP
endpoints:
- addresses:
  - 192.168.40.250
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    hajimari.io/appName: qBittorrent
    hajimari.io/icon: cloud-download
    hajimari.io/group: Downloads
    hajimari.io/targetBlank: 'false'
  name: qbittorrent-external-ingress
  namespace: external-endpoints
spec:
  ingressClassName: nginx
  rules:
  - host: qbittorrent.local.tecno-fly.com
    http:
      paths:
      - backend:
          service:
            name: qbittorrent-external-service
            port:
              number: 10095
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - qbittorrent.local.tecno-fly.com
    secretName: qbittorrent-tls
